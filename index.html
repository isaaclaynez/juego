<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperSMR Bros</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: Verdana, sans-serif; }

    /* ===== ESCENARIO + CIELO (varios azules muy parecidos) ===== */
    .escena {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom,
        #2f86e8 0%, #3f95ee 18%, #55a6f2 35%,
        #6fb7f5 52%, #8cc7f8 68%, #a9d6fa 82%, #c4e4fb 100%);
    }

    /* Sol */
    .sol {
      position: absolute;
      top: 8vh;
      right: 10%;
      width: 110px;
      height: 110px;
      background: #ffe14d;
      border-radius: 50%;
      box-shadow: 0 0 40px 20px rgba(255, 225, 77, 0.6);
    }

    /* Nubes */
    .nube {
      position: absolute;
      left: 0;
      width: 160px;
      height: 50px;
      background: white;
      border-radius: 50px;
      will-change: transform;
    }
    .nube::before, .nube::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .nube::before { width: 70px; height: 70px; top: -30px; left: 20px; }
    .nube::after  { width: 90px; height: 90px; top: -45px; left: 70px; }

    /* Montañas y suelo (dibujos SVG) */
    .montanas {
      position: absolute;
      left: 0;
      bottom: 17vh;
      width: 100%;
      aspect-ratio: 16 / 5;
      max-height: 70vh;
      pointer-events: none;
    }
    .suelo {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 24vh;
      pointer-events: none;
    }
    .montanas svg, .suelo svg { width: 100%; height: 100%; display: block; }

    /* ===== PANTALLAS ===== */
    .pantalla { position: absolute; inset: 0; }

    #inicio h1 {
      text-align: center;
      margin-top: 12vh;
      font-family: Impact, Arial Black, sans-serif;
      font-size: clamp(40px, 9vw, 110px);
      color: #ffd23f;
      letter-spacing: 4px;
      text-shadow: 4px 4px 0 #d62828, 8px 8px 0 #7a1010;
    }

    #boton-empezar {
      position: absolute;
      bottom: 6vh;
      left: 50%;
      transform: translateX(-50%);
      background: #d62828;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 20px 40px;
      border: 5px solid #ffd23f;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7a1010;
    }
    #boton-empezar:hover {
      background: #ef3b3b;
      transform: translateX(-50%) translateY(-3px);
    }

    /* ===== PANTALLA DE NIVELES ===== */
    #niveles { display: none; }

    #niveles h2 {
      text-align: center;
      margin-top: 8vh;
      font-family: Impact, Arial Black, sans-serif;
      font-size: clamp(30px, 5vw, 60px);
      color: #ffd23f;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0 #d62828, 6px 6px 0 #7a1010;
    }

    .tarjetas {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
      margin-top: 6vh;
    }

    .nivel {
      position: relative;
      width: 260px;
      background: #1e1e2f;
      border: 5px solid #ffd23f;
      border-radius: 10px;
      box-shadow: 0 6px 0 #7a1010;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .nivel:hover { transform: translateY(-5px); }
    .nivel .portada { display: block; width: 100%; height: 160px; }
    .nivel .etiqueta {
      padding: 10px;
      text-align: center;
      color: white;
      font-family: Impact, Arial Black, sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
    }

    /* Candado que bloquea el nivel */
    .bloqueo {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 30, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
    }
    .bloqueo svg { width: 80px; height: 80px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6)); }
    .nivel.desbloqueado .bloqueo { display: none; }
    .nivel.bloqueado:hover { transform: none; }

    /* Aviso rojo */
    #aviso {
      position: absolute;
      top: 5vh;
      left: 50%;
      transform: translateX(-50%);
      background: #c1121f;
      color: white;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      padding: 16px 28px;
      border: 4px solid #ffd6d6;
      border-radius: 8px;
      box-shadow: 0 6px 0 #6b0a12;
      max-width: 90%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 10;
    }
    #aviso.visible { opacity: 1; }

    /* ===== PANTALLA DE JUEGO ===== */
    #juego { display: none; }

    #boton-volver {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #d62828;
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 20px;
      border: 3px solid #ffd23f;
      border-radius: 8px;
      cursor: pointer;
    }
    #boton-volver:hover { background: #ef3b3b; }

    /* ===== PANEL "COMENZAR NIVEL" ===== */
    #comenzar {
      display: none;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
    }
    .panel-comenzar {
      background: #1e1e2f;
      border: 5px solid #ffd23f;
      border-radius: 12px;
      box-shadow: 0 8px 0 #7a1010;
      padding: 30px 50px;
      text-align: center;
    }
    .panel-comenzar h3 {
      font-family: Impact, Arial Black, sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: #ffd23f;
      margin-bottom: 25px;
    }
    .btn-grande {
      display: block;
      width: 100%;
      background: #d62828;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 16px 30px;
      border: 4px solid #ffd23f;
      border-radius: 8px;
      box-shadow: 0 5px 0 #7a1010;
      cursor: pointer;
    }
    .btn-grande:hover { background: #ef3b3b; }
    .btn-chico {
      margin-top: 18px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 15px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ===== PANTALLA NEGRA: ELEGIR PERSONAJE + CARGA ===== */
    #negro {
      display: none;
      z-index: 30;
      background: #000;
      opacity: 0;
      transition: opacity 0.8s;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6vh 0;
    }
    #aviso-pj {
      background: #1e1e2f;
      color: #ffd23f;
      font-family: Impact, Arial Black, sans-serif;
      font-size: clamp(24px, 4vw, 44px);
      letter-spacing: 3px;
      padding: 14px 40px;
      border: 4px solid #ffd23f;
      border-radius: 8px;
    }
    .personajes { display: flex; gap: 50px; justify-content: center; flex-wrap: wrap; }
    .pj {
      width: 220px;
      background: #1e1e2f;
      border: 5px solid #ffd23f;
      border-radius: 12px;
      padding: 14px 10px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.4s, border-color 0.2s;
    }
    .pj:hover { transform: translateY(-6px); }
    .pj svg { display: block; width: 100%; height: min(38vh, 300px); }
    .pj .izq { display: none; }
    .pj:hover .der { display: none; }
    .pj:hover .izq { display: block; }
    .pj .nombre {
      margin-top: 8px;
      color: white;
      font-family: Impact, Arial Black, sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
    }
    .personajes.ya-elegido { pointer-events: none; }
    .personajes.ya-elegido .pj { opacity: 0.25; transform: none; }
    .personajes.ya-elegido .pj.elegido { opacity: 1; border-color: #5bea5b; }

    #carga {
      width: min(600px, 80%);
      text-align: center;
      color: white;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.4s;
      min-height: 60px;
    }
    #carga.visible { opacity: 1; }
    #carga-barra {
      height: 26px;
      background: #222;
      border: 3px solid #ffd23f;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    #carga-relleno {
      width: 0%;
      height: 100%;
      background: linear-gradient(to bottom, #8cf064, #2f8f1f);
      transition: width 0.4s ease-out;
    }
    /* ===== BOTÓN VOLVER A INICIO ===== */
    #boton-inicio {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #d62828;
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 20px;
      border: 3px solid #ffd23f;
      border-radius: 8px;
      cursor: pointer;
    }
    #boton-inicio:hover { background: #ef3b3b; }

    /* ===== JUEGO: MUNDO ===== */
    #mundo { position: absolute; inset: 0; will-change: transform; }
    #mundo > div { position: absolute; }

    .s-b, .s-p {
      background-color: #c9683a;
      background-image:
        linear-gradient(rgba(90,35,15,.55) 3px, transparent 3px),
        linear-gradient(90deg, rgba(90,35,15,.55) 3px, transparent 3px);
      background-size: 40px 20px, 40px 40px;
      border: 3px solid #7a3318;
      border-radius: 3px;
    }
    .s-p { background-color: #e0a145; border-color: #8a5a10; }
    .s-q {
      background: #ffd23f;
      border: 3px solid #a06b00;
      border-radius: 4px;
      color: #fff;
      font: 26px/30px Impact, Arial Black, sans-serif;
      text-align: center;
      text-shadow: 2px 2px 0 #a06b00;
      animation: brillo 1s infinite alternate;
    }
    .s-q.usado { background: #8d8d8d; border-color: #555; color: #666; text-shadow: none; animation: none; }
    .s-q.golpe { transform: translateY(-8px); }
    @keyframes brillo { from { box-shadow: 0 0 4px 1px #fff7a0; } to { box-shadow: 0 0 16px 6px #fff7a0; } }

    .s-tubo {
      background: linear-gradient(90deg, #1f8a2e, #4fd25a 40%, #1f8a2e);
      border: 3px solid #0f4d18;
    }
    .s-tubo::before {
      content: "";
      position: absolute;
      top: -3px; left: -9px;
      width: calc(100% + 18px); height: 26px;
      background: linear-gradient(90deg, #1f8a2e, #5fe36a 40%, #1f8a2e);
      border: 3px solid #0f4d18;
      border-radius: 4px;
    }

    .moneda {
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7b0, #ffd23f 50%, #c98f00);
      border: 2px solid #a06b00;
      animation: giro 1s infinite linear;
    }
    @keyframes giro { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.25); } }
    .corazon { font-size: 24px; line-height: 24px; animation: latido .8s infinite alternate; }
    @keyframes latido { from { transform: scale(1); } to { transform: scale(1.2); } }

    .meta .mastil { position: absolute; left: 0; bottom: 0; width: 8px; height: 300px; background: #ddd; border: 2px solid #777; }
    .meta .bandera { position: absolute; left: 8px; bottom: 230px; width: 80px; height: 56px; background:
      conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0) 0 0 / 28px 28px; border: 2px solid #333; }
    .meta .tira { position: absolute; left: -30px; bottom: 0; width: 70px; height: 10px; background:
      conic-gradient(#000 25%, #fff 0 50%, #000 0 75%, #fff 0) 0 0 / 10px 10px; }
    .meta { width: 10px; height: 300px; }

    .en svg, .pr svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .en-fuego svg { animation: llama .25s infinite alternate; }
    @keyframes llama { from { transform: scale(1, .94); } to { transform: scale(.94, 1.06); } }
    .en.muere { transform: scale(1, .2) !important; transform-origin: 50% 100%; opacity: 0; transition: transform .35s, opacity .4s; }
    .pr-cap svg { animation: rueda .35s infinite linear; }
    @keyframes rueda { to { transform: rotate(360deg); } }
    .flot { color: #fff; font: 20px Impact, sans-serif; text-shadow: 2px 2px 0 #000; animation: sube .9s forwards; white-space: nowrap; z-index: 6; }
    @keyframes sube { to { transform: translateY(-50px); opacity: 0; } }

    /* ===== PERSONAJE ===== */
    .pjg { z-index: 5; }
    .pjg .cuerpo {
      position: absolute; left: 50%; bottom: 0;
      transform-origin: 50% 100%;
      transition: transform .12s;
    }
    .pjg svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .pjg .vi { display: none; }
    .pjg.mira-izq .vd { display: none; }
    .pjg.mira-izq .vi { display: block; }
    .pjg.anda .cuerpo { animation: paso .32s infinite; }
    @keyframes paso {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    .pjg.salta .cuerpo { transform: scale(.93, 1.08) rotate(calc(-5deg * var(--d, 1))); }
    .pjg.cae .cuerpo { transform: translateY(4px) scale(1.1, .9) rotate(calc(9deg * var(--d, 1))); }
    .pjg.agacha .cuerpo { transform: scale(1.12, .62); }
    .mano { display: none; }
    .salta .mano { display: inline; }
    .pjg.parpadeo { opacity: .35; }
    .pjg.poder { animation: arcoiris 1s infinite linear; filter: drop-shadow(0 0 8px gold); }
    @keyframes arcoiris { to { filter: drop-shadow(0 0 8px gold) hue-rotate(360deg); } }

    /* ===== HUD ===== */
    #hud { position: absolute; top: 16px; left: 190px; color: #fff; font-weight: bold; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 8; }
    #hud-vida { font-size: 28px; }
    #hud-monedas { font-size: 22px; margin-top: 4px; }
    #hud-poder { font-size: 18px; color: #ffe14d; }
    #progreso {
      position: absolute; bottom: 3vh; left: 50%; transform: translateX(-50%);
      width: min(560px, 70%); height: 28px;
      background: #222; border: 3px solid #ffd23f; border-radius: 14px; overflow: hidden; z-index: 8;
    }
    #progreso-relleno { height: 100%; width: 1%; background: linear-gradient(to bottom, #ffe97a, #ffb300); }
    #progreso-txt {
      position: absolute; inset: 0; text-align: center; line-height: 22px;
      color: #fff; font-weight: bold; font-size: 15px; text-shadow: 1px 1px 2px #000;
    }
    #cartel {
      display: none; position: absolute; top: 30%; width: 100%; text-align: center; z-index: 9;
      font-family: Impact, Arial Black, sans-serif; font-size: clamp(36px, 7vw, 80px);
      color: #ffd23f; text-shadow: 4px 4px 0 #d62828, 8px 8px 0 #7a1010;
    }
    #derrota {
      display: none; position: absolute; inset: 0; z-index: 9; background: rgba(0,0,0,.6);
      flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    #derrota h3 { font-family: Impact, Arial Black, sans-serif; font-size: 56px; color: #ff5a5a; text-shadow: 4px 4px 0 #000; }
    #derrota .btn-grande { width: 260px; }

    /* ===== PANTALLA NEGRA FINAL ===== */
    #fin {
      display: none; z-index: 40; background: #000; opacity: 0; transition: opacity .8s;
      flex-direction: column; align-items: center; justify-content: space-between; padding: 12vh 0 8vh; text-align: center;
    }
    #fin-frase { color: #ffd23f; font-family: Impact, Arial Black, sans-serif; font-size: clamp(22px, 3.5vw, 40px); max-width: 80%; letter-spacing: 1px; }
    #fin-caja { width: min(600px, 80%); color: #fff; font-weight: bold; }
    #fin-barra { height: 26px; background: #222; border: 3px solid #ffd23f; border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
    #fin-rel { width: 0%; height: 100%; background: linear-gradient(to bottom, #8cf064, #2f8f1f); transition: width .4s ease-out; }
  </style>
</head>
<body>

  <div class="escena">
    <div class="sol"></div>
    <div id="nubes"></div>

    <!-- MONTAÑAS (se dibujan con el script de abajo) -->
    <div class="montanas">
      <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="gBruma" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cfe8fb" stop-opacity="0"/>
            <stop offset="1" stop-color="#cfe8fb" stop-opacity="0.65"/>
          </linearGradient>
          <linearGradient id="gRoca" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="480">
            <stop offset="0" stop-color="#7b8798"/>
            <stop offset="0.6" stop-color="#8593a6"/>
            <stop offset="1" stop-color="#a3b3c8"/>
          </linearGradient>
          <g id="mont-defs"></g>
        </defs>

        <g id="mont-lejanas"></g>
        <g id="mont-principales"></g>

        <!-- Colinas verdes al pie -->
        <path fill="#5c9a50" d="M0,500 L0,462 Q150,425 320,462 T640,455 T960,466 T1280,452 T1600,460 L1600,500Z"/>
        <path fill="#4a8a3f" d="M0,500 L0,482 Q200,455 420,484 T860,478 T1300,486 T1600,476 L1600,500Z"/>
        <rect x="0" y="330" width="1600" height="170" fill="url(#gBruma)"/>
      </svg>
    </div>

    <!-- SUELO -->
    <div class="suelo">
      <svg viewBox="0 0 1600 220" preserveAspectRatio="xMidYMin slice">
        <defs>
          <linearGradient id="gTierra" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a5a34"/>
            <stop offset="1" stop-color="#4a2c17"/>
          </linearGradient>
          <linearGradient id="gHierba" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7be04f"/>
            <stop offset="1" stop-color="#37901f"/>
          </linearGradient>
        </defs>
        <rect x="0" y="40" width="1600" height="180" fill="url(#gTierra)"/>
        <g id="detalles-suelo"></g>
      </svg>
    </div>

    <!-- PANTALLA 1: INICIO -->
    <div id="inicio" class="pantalla">
      <h1>SuperSMR Bros</h1>
      <button id="boton-empezar" onclick="mostrarNiveles()">Clica aquí para comenzar</button>
    </div>

    <!-- PANTALLA 2: SELECCIÓN DE NIVELES -->
    <div id="niveles" class="pantalla">
      <button id="boton-inicio" tabindex="-1" onclick="volverAInicio()">← Volver a inicio</button>
      <h2>Selecciona nivel</h2>

      <div class="tarjetas">

        <!-- NIVEL 1 (siempre disponible) -->
        <div class="nivel desbloqueado" id="nivel1" onclick="entrarNivel(1)">
          <svg class="portada" viewBox="0 0 260 160" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="p1Cielo" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2f86e8"/>
                <stop offset="0.6" stop-color="#7cc0f7"/>
                <stop offset="1" stop-color="#c4e4fb"/>
              </linearGradient>
            </defs>
            <rect width="260" height="160" fill="url(#p1Cielo)"/>
            <circle cx="220" cy="28" r="16" fill="#ffe14d"/>
            <g fill="#fff">
              <ellipse cx="60" cy="30" rx="26" ry="8"/><circle cx="52" cy="25" r="9"/><circle cx="68" cy="22" r="11"/>
              <ellipse cx="160" cy="48" rx="18" ry="6" opacity="0.9"/><circle cx="156" cy="44" r="7" opacity="0.9"/>
            </g>
            <polygon fill="#a3b8d2" points="0,125 40,80 75,105 120,70 170,110 210,85 260,115 260,160 0,160"/>
            <polygon fill="#8593a6" points="10,130 70,55 115,130"/>
            <polygon fill="#566177" points="70,55 115,130 88,130 80,95"/>
            <polygon fill="#f4f8fd" points="70,55 58,76 66,72 72,79 79,72 84,78"/>
            <polygon fill="#8593a6" points="95,130 160,25 225,130"/>
            <polygon fill="#566177" points="160,25 225,130 185,130 168,80 172,55"/>
            <polygon fill="#f4f8fd" points="160,25 143,58 152,52 160,62 169,52 178,58 174,50"/>
            <path fill="#5c9a50" d="M0,160 L0,132 Q70,118 140,132 T260,128 L260,160Z"/>
            <rect y="140" width="260" height="20" fill="#4cc233"/>
            <rect y="152" width="260" height="8" fill="#8a5a34"/>
          </svg>
          <div class="etiqueta">Nivel 1</div>
        </div>

        <!-- NIVEL 2 (bloqueado hasta completar el 1) -->
        <div class="nivel bloqueado" id="nivel2" onclick="entrarNivel(2)">
          <svg class="portada" viewBox="0 0 260 160" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="p2Cielo" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3a2a6b"/>
                <stop offset="0.6" stop-color="#c0527a"/>
                <stop offset="1" stop-color="#ffb26b"/>
              </linearGradient>
            </defs>
            <rect width="260" height="160" fill="url(#p2Cielo)"/>
            <circle cx="60" cy="95" r="18" fill="#ffd27a"/>
            <polygon fill="#4a3a6a" points="0,120 50,75 100,110 150,60 210,105 260,85 260,160 0,160"/>
            <polygon fill="#2c2147" points="0,145 60,100 120,140 190,95 260,135 260,160 0,160"/>
          </svg>
          <div class="etiqueta">Nivel 2</div>

          <!-- Candado -->
          <div class="bloqueo">
            <svg viewBox="0 0 64 64">

  <script>
    /* ===== PROGRESO CIFRADO ===== */
    var CLAVE = "SMR-superbros-2026-x9K";   // cambia este texto por el tuyo
    var nivelActual = 0;

    // Huella digital del texto: si alguien modifica el progreso a mano, no coincide
    function firma(texto) {
      var h = 2166136261;
      for (var i = 0; i < texto.length; i++) {
        h ^= texto.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16);
    }

    // Guarda "nivel 1 completado" cifrado y firmado
    function guardarProgreso() {
      try {
        var datos = "nivel1=completado";
        localStorage.setItem("smr_p", btoa(datos + "|" + firma(datos + CLAVE)));
      } catch (e) {}
    }

    // Lee el progreso y comprueba que la firma sea válida
    function nivel1Completado() {
      try {
        var t = atob(localStorage.getItem("smr_p") || "");
        var partes = t.split("|");
        return partes[0] === "nivel1=completado" && partes[1] === firma(partes[0] + CLAVE);
      } catch (e) {
        return false;
      }
    }

    // Pone o quita el candado del nivel 2 según el progreso
    function actualizarNiveles() {
      var n2 = document.getElementById("nivel2");
      if (nivel1Completado()) {
        n2.classList.add("desbloqueado");
        n2.classList.remove("bloqueado");
      } else {
        n2.classList.add("bloqueado");
        n2.classList.remove("desbloqueado");
      }
    }

    // Esto se llamará desde el juego cuando se termine el nivel 1
    function completarNivel1() {
      guardarProgreso();
      actualizarNiveles();
    }

    // Para volver a bloquear el nivel 2 (útil para hacer pruebas)
    function reiniciarProgreso() {
      try { localStorage.removeItem("smr_p"); } catch (e) {}
      actualizarNiveles();
    }

    /* ===== NAVEGACIÓN ENTRE PANTALLAS ===== */
    function mostrarNiveles() {
      if (typeof detenerJuego === "function") detenerJuego();
      document.getElementById("inicio").style.display = "none";
      document.getElementById("juego").style.display = "none";
      document.getElementById("comenzar").style.display = "none";
      var negro = document.getElementById("negro");
      negro.style.display = "none";
      negro.style.opacity = 0;
      document.getElementById("niveles").style.display = "block";
      actualizarNiveles();
    }

    function volverANiveles() {
      mostrarNiveles();
    }

    // Al pulsar un nivel: aparece el recuadro "Comenzar nivel"
    function entrarNivel(n) {
      if (n === 2 && !nivel1Completado()) {
        mostrarAviso();
        return;
      }
      nivelActual = n;
      document.getElementById("titulo-nivel").textContent = "Nivel " + n;
      document.getElementById("comenzar").style.display = "flex";
    }

    // Al pulsar "Comenzar nivel": la pantalla se pone en negro
    function comenzarNivel() {
      var negro = document.getElementById("negro");
      reiniciarSeleccion();
      document.getElementById("comenzar").style.display = "none";
      negro.style.display = "flex";
      void negro.offsetWidth;          // fuerza el efecto de fundido
      negro.style.opacity = 1;
    }

    function reiniciarSeleccion() {
      document.getElementById("personajes").classList.remove("ya-elegido");
      document.getElementById("pj-zipi").classList.remove("elegido");
      document.getElementById("pj-zape").classList.remove("elegido");
      document.getElementById("carga").classList.remove("visible");
      document.getElementById("carga-relleno").style.width = "0%";
      document.getElementById("carga-texto").textContent = "0%";
    }

    var personajeElegido = null;

    function elegirPersonaje(nombre) {
      personajeElegido = nombre;
      document.getElementById("personajes").classList.add("ya-elegido");
      document.getElementById("pj-" + nombre).classList.add("elegido");
      document.getElementById("carga").classList.add("visible");
      cargar();
    }

    // Barra de carga: unos 5 segundos, avanzando a saltos irregulares
    function cargar() {
      var n = 10, i, s = 0, s2 = 0, acum = 0, t = 0;
      var saltos = [], pausas = [], pct = [];
      for (i = 0; i < n; i++) { saltos.push(0.4 + Math.random()); s += saltos[i]; }
      for (i = 0; i < n; i++) { pausas.push(0.4 + Math.random()); s2 += pausas[i]; }
      for (i = 0; i < n; i++) { acum += saltos[i] / s * 100; pct.push(Math.round(acum)); }
      pct[n - 1] = 100;

      pct.forEach(function (p, i) {
        t += pausas[i] / s2 * 5000;
        setTimeout(function () {
          document.getElementById("carga-relleno").style.width = p + "%";
          document.getElementById("carga-texto").textContent = p + "%";
        }, t);
      });
      setTimeout(iniciarJuego, t + 700);
    }

    // Termina la carga: se quita el negro y se muestra la pantalla de juego (vacía por ahora)
    function iniciarJuego() {
      var negro = document.getElementById("negro");
      document.getElementById("niveles").style.display = "none";
      document.getElementById("juego").style.display = "block";
      arrancarNivel();
      negro.style.opacity = 0;
      setTimeout(function () { negro.style.display = "none"; }, 800);
    }

    /* ===== AVISO ROJO (desaparece a los 3 segundos) ===== */
    var temporizadorAviso = null;
    function mostrarAviso() {
      var aviso = document.getElementById("aviso");
      aviso.classList.add("visible");
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(function () {
        aviso.classList.remove("visible");
      }, 3000);
    }

    // Generador de números "aleatorios" repetibles: misma semilla = mismos resultados siempre
    function semilla(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    /* ===== NUBES: patrón de 5 minutos que se repite ===== */
    (function () {
      var CICLO = 300;            // segundos
      var r = semilla(2024);
      var contenedor = document.getElementById("nubes");
      var nubes = [];

      for (var i = 0; i < 18; i++) {
        var el = document.createElement("div");
        el.className = "nube";
        el.style.top = (3 + r() * 30) + "vh";
        el.style.opacity = (0.8 + r() * 0.15).toFixed(2);
        contenedor.appendChild(el);
        nubes.push({
          el: el,
          inicio: r() * CICLO,
          duracion: 50 + r() * 60,
          escala: 0.6 + r() * 0.7
        });
      }

      function mover() {
        var t = performance.now() / 1000;
        var ancho = window.innerWidth;
        for (var i = 0; i < nubes.length; i++) {
          var n = nubes[i];
          var fase = (((t - n.inicio) % CICLO) + CICLO) % CICLO / n.duracion;
          if (fase <= 1) {
            var px = -300 + fase * (ancho + 600);
            n.el.style.display = "block";
            n.el.style.transform = "translate3d(" + px.toFixed(1) + "px,0,0) scale(" + n.escala.toFixed(2) + ")";
          } else {
            n.el.style.display = "none";
          }
        }
        requestAnimationFrame(mover);
      }
      mover();
    })();

    /* ===== MONTAÑAS: relieve generado con código ===== */
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var r = semilla(31);   // cambia este número para obtener otras montañas
      var defs = document.getElementById("mont-defs");
      var lejos = document.getElementById("mont-lejanas");
      var cerca = document.getElementById("mont-principales");

      function crear(padre, tipo, atrib) {
        var e = document.createElementNS(NS, tipo);
        for (var k in atrib) e.setAttribute(k, atrib[k]);
        padre.appendChild(e);
        return e;
      }
      function p(x, y) { return x.toFixed(1) + "," + y.toFixed(1); }

      function ruido() {
        var v = [], i;
        for (i = 0; i < 256; i++) v.push(r());
        return function (x) {
          var i = Math.floor(x), f = x - i;
          f = f * f * (3 - 2 * f);
          return v[i & 255] * (1 - f) + v[(i + 1) & 255] * f;
        };
      }

      function cordillera(color, base, amp, esc) {
        var n1 = ruido(), n2 = ruido(), n3 = ruido();
        var pts = "0,500", x;
        for (x = 0; x <= 1600; x += 8) {
          var c1 = 1 - Math.abs(2 * n1(x / esc) - 1);
          var y = base - amp * c1 - amp * 0.3 * n2(x / (esc / 3)) - amp * 0.08 * n3(x / (esc / 9));
          pts += " " + p(x, y);
        }
        pts += " 1600,500";
        crear(lejos, "polygon", { points: pts, fill: color });
      }
      cordillera("#bccfe4", 305, 120, 170);
      cordillera("#a3b8d2", 335, 105, 120);

      function montana(id, px, py, Wl, Wr, base) {
        var H = base - py;
        var nA = ruido(), nB = ruido(), nC = ruido(), nS = ruido(), nT = ruido();
        var i, n, t;

        function altura(x) {
          var d = x < px ? (px - x) / Wl : (x - px) / Wr;
          if (d >= 1) return 0;
          var h = H * Math.pow(1 - d, 1.3);
          var k = Math.min(1, d * 4) * Math.min(1, (1 - d) * 3);
          h += k * H * ((nA(x / 70) - 0.5) * 0.16 + (nB(x / 22) - 0.5) * 0.07 + (nC(x / 7) - 0.5) * 0.025);
          return Math.max(0, h);
        }

        var xs = [];
        n = Math.ceil(Wl / 6);
        for (i = 0; i < n; i++) xs.push(px - Wl + i * Wl / n);
        n = Math.ceil(Wr / 6);
        for (i = 0; i <= n; i++) xs.push(px + i * Wr / n);

        var borde = [];
        for (i = 0; i < xs.length; i++) borde.push(p(xs[i], base - altura(xs[i])));
        var sil = p(px - Wl, 500) + " " + borde.join(" ") + " " + p(px + Wr, 500);

        var cp = crear(defs, "clipPath", { id: "cpm" + id });
        crear(cp, "polygon", { points: sil });

        crear(cerca, "polygon", { points: sil, fill: "url(#gRoca)" });
        var g = crear(cerca, "g", { "clip-path": "url(#cpm" + id + ")" });

        var cresta = [], rx = px + 0.1 * Wr;
        for (i = 0; i <= 24; i++) {
          t = i / 24;
          var cx = px + (rx - px) * t + (nA(t * 7 + 40) - 0.5) * 0.36 * Wl * Math.min(1, t * 4);
          cresta.push([cx, py + (base + 30 - py) * t]);
        }
        var crestaTxt = cresta.map(function (q) { return p(q[0], q[1]); }).join(" ");

        var nieve = "M" + p(px - Wl, py - 40);
        for (i = 0; i < xs.length; i++) {
          var sy = py + H * 0.2 + (nS(xs[i] / 40) - 0.5) * H * 0.13 + (nT(xs[i] / 11) - 0.5) * H * 0.05;
          nieve += " L" + p(xs[i], sy);
        }
        nieve += " L" + p(px + Wr, py - 40) + " Z";
        crear(g, "path", { d: nieve, fill: "#f4f8fd" });

        for (i = 0; i < 80; i++) {
          var fx = px - Wl * 0.9 + r() * (Wl * 0.9 + Wr * 0.9);
          var fy = py + r() * (base - py);
          var s = 14 + r() * 46;
          var tri = p(fx, fy) + " " +
                    p(fx + s * (0.3 + r() * 0.6), fy + s * (0.3 + r() * 0.6)) + " " +
                    p(fx - s * (0.2 + r() * 0.6), fy + s * (0.6 + r() * 0.9));
          crear(g, "polygon", {
            points: tri,
            fill: r() > 0.5 ? "#ffffff" : "#1b2638",
            "fill-opacity": (0.03 + r() * 0.07).toFixed(3)
          });
        }

        crear(g, "polygon", {
          points: crestaTxt + " " + p(px + Wr + 60, base + 30) + " " + p(px + Wr + 60, py - 40) + " " + p(px, py - 40),
          fill: "rgba(255,240,205,0.13)"
        });

        crear(g, "polygon", {
          points: p(px, py - 40) + " " + crestaTxt + " " + p(px - Wl - 60, base + 30) + " " + p(px - Wl - 60, py - 40),
          fill: "rgba(28,42,82,0.38)"
        });

        for (i = 0; i < 9; i++) {
          var gx = px + (r() - 0.5) * Math.min(Wl, Wr) * 1.0;
          var gy = py + H * (0.1 + r() * 0.25);
          var izq = [], der = [];
          for (t = 0; t <= 1.0001; t += 1 / 14) {
            var bx = gx + (gx - px) * 0.45 * t + (nA(i * 13 + t * 6) - 0.5) * 40;
            var by = gy + (base + 20 - gy) * t;
            var w = 1 + 8 * t;
            izq.push(p(bx - w, by));
            der.push(p(bx + w, by));
          }
          crear(g, "polygon", {
            points: izq.concat(der.reverse()).join(" "),
            fill: "rgba(20,30,50," + (0.14 + r() * 0.12).toFixed(2) + ")"
          });
        }

        crear(g, "polyline", { points: crestaTxt, fill: "none", stroke: "rgba(255,255,255,0.28)", "stroke-width": 2 });
      }

      montana(0, 800, 40, 440, 460, 472);
      montana(1, 300, 135, 330, 340, 472);
      montana(2, 1330, 150, 330, 300, 472);
    })();

    /* ===== SUELO: césped, tierra y piedras ===== */
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var g = document.getElementById("detalles-suelo");
      var r = semilla(7);
      var x, i;

      function el(tipo, atributos) {
        var e = document.createElementNS(NS, tipo);
        for (var k in atributos) e.setAttribute(k, atributos[k]);
        g.appendChild(e);
        return e;
      }
      function borde(x) { return 26 + 4 * Math.sin(x / 90) + 3 * Math.sin(x / 37 + 1); }

      for (i = 0; i < 3; i++) {
        var d = "";
        for (x = 0; x <= 1600; x += 40) {
          d += (x ? "L" : "M") + x + "," + (95 + i * 48 + 8 * Math.sin(x / 130 + i)).toFixed(1) + " ";
        }
        el("path", { d: d, fill: "none", stroke: "rgba(0,0,0,0.14)", "stroke-width": 10 });
      }

      var colores = ["#9b8b7a", "#6e5f50", "#b3a595", "#5a4a3b"];
      for (i = 0; i < 80; i++) {
        var rx = 3 + r() * 7;
        el("ellipse", {
          cx: (r() * 1600).toFixed(1), cy: (75 + r() * 140).toFixed(1),
          rx: rx.toFixed(1), ry: (rx * 0.7).toFixed(1),
          fill: colores[Math.floor(r() * colores.length)]
        });
      }

      for (i = 0; i < 16; i++) {
        var cx = r() * 1600, cy = 90 + r() * 115, s = 12 + r() * 16, pts = "";
        for (var a = 0; a < 7; a++) {
          var ang = a / 7 * Math.PI * 2, rad = s * (0.7 + r() * 0.4);
          pts += (cx + Math.cos(ang) * rad * 1.3).toFixed(1) + "," + (cy + Math.sin(ang) * rad * 0.8).toFixed(1) + " ";
        }
        el("polygon", { points: pts, fill: "#8d9199", stroke: "#4d4f55", "stroke-width": 2 });
        el("ellipse", { cx: (cx - s * 0.3).toFixed(1), cy: (cy - s * 0.3).toFixed(1), rx: (s * 0.4).toFixed(1), ry: (s * 0.2).toFixed(1), fill: "rgba(255,255,255,0.25)" });
      }

      var arriba = "", abajo = [];
      for (x = 0; x <= 1600; x += 10) arriba += (x ? "L" : "M") + x + "," + borde(x).toFixed(1) + " ";
      for (x = 1600; x >= 0; x -= 10) abajo.push("L" + x + "," + (borde(x) + 30 + ((x / 10) % 2 ? 9 : 0) + r() * 6).toFixed(1));
      el("path", { d: arriba + abajo.join(" ") + "Z", fill: "url(#gHierba)" });

      var linea = "";
      for (x = 0; x <= 1600; x += 10) linea += x + "," + borde(x).toFixed(1) + " ";
      el("polyline", { points: linea, fill: "none", stroke: "#a5f27a", "stroke-width": 3 });

      for (x = 0; x < 1600; x += 7) {
        var y = borde(x);
        el("polygon", {
          points: x + "," + (y + 3) + " " + (x + 2.5) + "," + (y - 6 - r() * 7).toFixed(1) + " " + (x + 5) + "," + (y + 3),
          fill: r() > 0.5 ? "#4cc233" : "#6fe04a"
        });
      }

      for (i = 0; i < 14; i++) {
        var fx = r() * 1600;
        el("circle", { cx: fx.toFixed(1), cy: (borde(fx) + 12).toFixed(1), r: 2.6, fill: r() > 0.5 ? "#ffffff" : "#ffe14d" });
      }
    })();

    /* ===== PERSONAJES: Zipi y Zape (cada uno mirando a la derecha y a la izquierda) ===== */
    var ZIPI = `
      <g transform="translate(0,60)">
        <ellipse cx="100" cy="250" rx="55" ry="8" fill="rgba(0,0,0,.35)"/>
        <rect x="74" y="212" width="24" height="30" rx="8" fill="#1d4ed8"/>

        <rect x="110" y="120" width="12" height="44" rx="5" fill="#2563eb"/>
        <circle cx="116" cy="170" r="4" fill="#ffd23f"/>

    var ZAPE = `
      <ellipse cx="100" cy="312" rx="45" ry="7" fill="rgba(0,0,0,.35)"/>
      <rect x="80" y="185" width="18" height="108" rx="7" fill="#2563eb"/>

      // ---- Utilidades ----
      function div(clase, html) {

      function colocar(el, x, y, w, h) {

      function sup(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
      function choca(o) {

      // El suelo del juego es la línea del césped del fondo
      function medir() {

      /* ===================== CONSTRUCCIÓN DEL MAPA =====================
         Todo está pensado para ser accesible:
         - Salto máximo: Zipi ~166 px, Zape ~194 px.
         - Muros y tubos: máximo 120 px de alto.
         - Suelos en el aire: parte de abajo a 90 px, parte de arriba a 126 px.
         - Segundo piso: sube 90 px más, con 70 px de hueco para tomar impulso.
         - No hay huecos en el suelo, así que nunca se puede quedar atrapado.   */
      function construirNivel(n) {
        var r = semilla(500 + n * 31);
        var LEN = n === 1 ? 8500 : 10500;
        var L = { LEN: LEN, meta: LEN - 350, solidos: [], items: [], enemigos: [] };

        function bloque(x, y, w, h, tipo) { var s = { x: x, y: y, w: w, h: h, tipo: tipo, usado: false }; L.solidos.push(s); return s; }
        function item(tipo, x, y) { L.items.push({ tipo: tipo, x: x, y: y, w: 24, h: 24, rec: false }); }
        function filaMonedas(x, y, k, sep) { for (var i = 0; i < k; i++) item("moneda", x + i * (sep || 36), y); }
        function enemigo(tipo, x) {
          var e = { tipo: tipo, x: x, y: 0, vx: 0, dir: -1, vivo: true, cd: 0, t: 0 };
          if (tipo === "seta")  { e.w = 40; e.h = 36; }
          if (tipo === "koopa") { e.w = 44; e.h = 64; e.x0 = x - 130; e.x1 = x + 130; e.cd = 40; e.dir = 1; }
          if (tipo === "fuego") { e.w = 40; e.h = 40; e.y = 52; e.cd = 60; }
          L.enemigos.push(e);
        }

        var modulos = {
          tubo: function (x) { var h = r() < 0.5 ? 64 : 96; bloque(x, 0, 64, h, "tubo"); filaMonedas(x + 20, h + 25, 1); return 64; },
          muro: function (x) {
            var ancho = 40 * (1 + Math.floor(r() * 2)), alto = 40 * (1 + Math.floor(r() * 3));
            bloque(x, 0, ancho, alto, "b"); filaMonedas(x + ancho / 2 - 12, alto + 25, 1); return ancho;
          },
          escalera: function (x) {
            var k = 2 + Math.floor(r() * 2);
            for (var i = 0; i < k; i++) bloque(x + i * 40, 0, 40, 40 * (i + 1), "b");
            filaMonedas(x + (k - 1) * 40 + 8, 40 * k + 25, 1); return k * 40;
          },
          plataforma: function (x) {
            var k = 3 + Math.floor(r() * 3), q = Math.floor(r() * k);
            for (var i = 0; i < k; i++) bloque(x + i * 40, 90, 40, 36, i === q ? "q" : "p");
            filaMonedas(x + 8, 150, k, 40); return k * 40;
          },
          torre: function (x) {
            for (var i = 0; i < 3; i++) bloque(x + i * 40, 90, 40, 36, "p");
            filaMonedas(x + 8, 150, 3, 40);
            for (var j = 0; j < 3; j++) bloque(x + 190 + j * 40, 180, 40, 36, j === 1 ? "q" : "p");
            item("corazon", x + 190 + 48, 230);
            return 310;
          },
          monedas: function (x) { for (var i = 0; i < 6; i++) item("moneda", x + i * 38, 30 + Math.sin(i / 5 * Math.PI) * 60); return 230; },
          corazon: function (x) { item("corazon", x, 30); filaMonedas(x + 50, 30, 3); return 170; },
          seta: function (x) { var k = 1 + Math.floor(r() * 3); for (var i = 0; i < k; i++) enemigo("seta", x + 60 + i * 100); return k * 100 + 120; },
          koopa: function (x) { enemigo("koopa", x + 150); return 330; },
          fuego: function (x) { var k = 1 + Math.floor(r() * (n === 1 ? 1.5 : 2.5)); for (var i = 0; i < k; i++) enemigo("fuego", x + 60 + i * 90); return k * 90 + 100; }
        };

        var tabla = n === 1
          ? [["tubo",14],["muro",12],["escalera",8],["plataforma",18],["torre",8],["monedas",10],["corazon",4],["seta",12],["koopa",8],["fuego",6]]
          : [["tubo",10],["muro",9],["escalera",7],["plataforma",14],["torre",8],["monedas",8],["corazon",4],["seta",16],["koopa",14],["fuego",10]];
        var total = tabla.reduce(function (a, b) { return a + b[1]; }, 0);
        function elegir() {
          var v = r() * total;
          for (var i = 0; i < tabla.length; i++) { v -= tabla[i][1]; if (v <= 0) return tabla[i][0]; }

        }

        var x = 750, cont = 0;
        while (x < LEN - 1000) {
          cont++;
          var tipo = (cont % 6 === 0) ? "corazon" : elegir();   // cada 6 zonas hay un corazón seguro
          x += modulos[tipo](x) + (n === 1 ? 290 : 240) + r() * 160;
        }
        return L;
      }

      /* ===================== ARRANQUE Y DIBUJO ===================== */
      function arrancarNivel() {

      function montar() {
        var g = G, c = g.cfg;
        $("mundo").innerHTML = "";
        g.L.solidos.forEach(function (s) {
          s.el = div(s.tipo === "q" ? "s-q" : s.tipo === "tubo" ? "s-tubo" : s.tipo === "p" ? "s-p" : "s-b", s.tipo === "q" ? "?" : "");

          '<div class="vi" style="height:100%">' + dibujarPJ(g.nombre, -1, c.vb) + '</div></div>');

      function posEstaticos() {
        var g = G;
        g.L.solidos.forEach(function (s) { colocar(s.el, s.x, s.y, s.w, s.h); });
        g.L.items.forEach(function (i) { colocar(i.el, i.x, i.y, i.w, i.h); });
        colocar(g.L.metaEl, g.L.meta, 0, 10, 300);
      }

      function bucle(t) {
        raf = requestAnimationFrame(bucle);
        if (!G) return;
        var dt = Math.min(3, (t - ultimo) / 16.667);
        ultimo = t;
        while (dt > 0) { var d = Math.min(dt, 1); paso(d); dt -= d; }
        dibujar();
      }

      function paso(d) {
        var g = G;
        if (g.fin || g.muerto) return;
        jugador(d);
        enemigos(d);
        proyectiles(d);
        recoger();
        if (g.inv > 0) g.inv -= d;
        if (g.poder > 0) g.poder -= d;
        if (g.x + g.w / 2 >= g.L.meta) ganar();
      }

      /* ===================== JUGADOR ===================== */
      function jugador(d) {
        var g = G, c = g.cfg;
        var izq = K.KeyA || K.ArrowLeft, der = K.KeyD || K.ArrowRight;
        var ag = K.ShiftLeft || K.ShiftRight || K.ArrowDown;
        var sal = K.Space || K.ArrowUp;

        // Agacharse (solo en el suelo). Si hay techo encima, se queda agachado.
        if (g.suelo && ag && !g.agach) { g.agach = true; g.h = c.hAg; }
        else if (g.agach && !(g.suelo && ag)) {
          g.h = c.h;
          if (choca(g)) g.h = c.hAg; else g.agach = false;
        }

        var mv = (der ? 1 : 0) - (izq ? 1 : 0);
        var vel = c.vel * (g.poder > 0 ? 1.3 : 1);
        g.vx = mv * vel * (g.agach ? 0.45 : 1);
        if (mv) g.dir = mv;

        if (!sal) g.saltoListo = true;
        if (sal && g.suelo && g.saltoListo && !g.agach) { g.vy = c.salto; g.suelo = false; g.saltoListo = false; }

        // Gravedad (con Shift en el aire se cae más rápido). No hay daño por caída.
        g.vy -= c.grav * d;
        if (!g.suelo && ag) g.vy -= 0.9 * d;
        var maxCaida = (!g.suelo && ag) ? -22 : -13;
        if (g.vy < maxCaida) g.vy = maxCaida;

        // Movimiento horizontal
        g.x += g.vx * d;
        if (g.x < 0) g.x = 0;
        if (g.x > g.L.LEN - g.w) g.x = g.L.LEN - g.w;
        var s = g.L.solidos, i;
        for (i = 0; i < s.length; i++) {
          if (sup(g, s[i])) {
            if (g.vx > 0) g.x = s[i].x - g.w; else if (g.vx < 0) g.x = s[i].x + s[i].w;
          }
        }

        // Movimiento vertical
        g.y += g.vy * d;
        g.suelo = false;
        if (g.y <= 0) { g.y = 0; if (g.vy < 0) g.vy = 0; g.suelo = true; }
        for (i = 0; i < s.length; i++) {
          if (sup(g, s[i])) {
            if (g.vy <= 0) { g.y = s[i].y + s[i].h; g.vy = 0; g.suelo = true; }
            else { g.y = s[i].y - g.h; g.vy = 0; if (s[i].tipo === "q") golpearQ(s[i]); }
          }
        }
      }

      function golpearQ(s) {
        if (s.usado) return;
        s.usado = true;
        s.el.className = "s-q usado golpe";
        setTimeout(function () { if (s.el) s.el.classList.remove("golpe"); }, 150);
        var r = Math.random();
        if (r < 0.6) flotante(s.x, s.y + 44, "Vacío");
        else if (r < 0.9) { monedasTotal++; flotante(s.x, s.y + 44, "+1 🪙"); }
        else { G.poder = 3600; flotante(s.x, s.y + 44, "¡PODER! 60s"); }
      }

      function flotante(x, y, txt) {
        var f = div("flot", txt);
        colocar(f, x, y);
        setTimeout(function () { f.remove(); }, 900);
      }

      function hurt() {
        var g = G;
        if (g.inv > 0 || g.poder > 0 || g.muerto) return;
        g.vidas--;
        g.inv = 70;
        if (g.vidas <= 0) perder();
      }

      function recoger() {
        var g = G;
        g.L.items.forEach(function (it) {
          if (it.rec || !sup(g, it)) return;
          if (it.tipo === "moneda") monedasTotal++;
          else { if (g.vidas >= 6) return; g.vidas++; }   // máximo 6 corazones
          it.rec = true;
          it.el.style.display = "none";
        });
      }

      /* ===================== ENEMIGOS ===================== */
      function matar(e) {
        e.vivo = false;
        e.el.classList.add("muere");
        setTimeout(function () { e.el.style.display = "none"; }, 450);
      }

      function proyectil(tipo, x, y, vx) {
        var el = div("pr pr-" + tipo, tipo === "cap" ? SVG_CAP : SVG_BOLA);
        colocar(el, x, y, 22, 22);
        G.proy.push({ tipo: tipo, x: x, y: y, w: 22, h: 22, vx: vx, x0: x, el: el });
      }

      function enemigos(d) {
        var g = G, aire = !g.suelo;
        for (var k = 0; k < g.L.enemigos.length; k++) {
          var e = g.L.enemigos[k];
          if (!e.vivo) continue;

          // Matar saltando encima (también vale mientras se cae)
          if (sup(g, e) && g.vy < 0 && g.y > e.y + e.h * 0.4) {
            matar(e); g.vy = 9.5; g.suelo = false; continue;
          }
          if (aire) continue;     // con el jugador en el aire, todos quedan quietos y no atacan

          var dx = (g.x + g.w / 2) - (e.x + e.w / 2), dy = g.y - e.y, lado = dx > 0 ? 1 : -1;
          e.cd -= d;

          if (e.tipo === "seta") {
            if (Math.abs(dx) < 320 && Math.abs(dy) < 160) { e.vx = lado * 1.7; e.dir = lado; } else e.vx = 0;
            var ox = e.x; e.x += e.vx * d; if (choca(e)) e.x = ox;
            if (sup(g, e) && e.cd <= 0 && g.inv <= 0 && g.poder <= 0) {
              e.cd = 70;
              g.golpesSeta++;
              if (g.golpesSeta >= 2) { g.golpesSeta = 0; hurt(); } else g.inv = 25;
              var ox2 = e.x; e.x -= lado * 18; if (choca(e)) e.x = ox2;
            }
          } else if (e.tipo === "koopa") {
            if (Math.abs(dx) < 400 && g.y < 150) {
              e.dir = lado;                                   // se queda quieto y mira hacia ti
              if (e.cd <= 0) {
                var bajo = Math.random() < 0.5;
                proyectil("cap", e.dir > 0 ? e.x + e.w : e.x - 22, bajo ? 4 : 82, e.dir * 5.2);
                e.cd = 110;
              }
            } else {
              e.x += e.dir * 1.0 * d;                         // recorrido de ida y vuelta
              if (e.x > e.x1) e.dir = -1;
              if (e.x < e.x0) e.dir = 1;
              if (e.cd < 40) e.cd = 40;
            }
          } else {   // fuego
            e.t += d;
            if (Math.abs(dx) < 430 && Math.abs(dy) < 260) { e.dir = lado; e.x += lado * 1.9 * d; }
            e.y = 52 + Math.sin(e.t / 18) * 8;
            if (Math.abs(dx) < 260) {
              if (e.cd <= 0) { proyectil("bola", lado > 0 ? e.x + e.w : e.x - 22, e.y + 8, lado * 5.5); matar(e); }
            } else if (e.cd < 60) e.cd = 60;
          }
        }
      }

      function proyectiles(d) {
        var g = G;
        for (var i = g.proy.length - 1; i >= 0; i--) {
          var p = g.proy[i];
          p.x += p.vx * d;
          var quitar = Math.abs(p.x - p.x0) > 900 || choca(p);
          if (!quitar && g.suelo && sup(g, p) && g.inv <= 0 && g.poder <= 0) { hurt(); quitar = true; }
          if (quitar) { p.el.remove(); g.proy.splice(i, 1); }
        }
      }

      /* ===================== FINAL Y DERROTA ===================== */
      function ganar() {
        var g = G;
        if (g.fin) return;
        g.fin = true;
        $("cartel").textContent = "¡Nivel completado!";
        $("cartel").style.display = "block";
        temporizar(pantallaFin, 1600);
      }

      function cargaFalsa(pintar, alTerminar) {
        var n = 10, i, s = 0, s2 = 0, sal = [], pau = [], acum = 0, t = 0;
        for (i = 0; i < n; i++) { sal.push(0.4 + Math.random()); s += sal[i]; pau.push(0.4 + Math.random()); s2 += pau[i]; }
        for (i = 0; i < n; i++) {
          acum += sal[i] / s * 100;
          t += pau[i] / s2 * 5000;
          (function (p, tt) { temporizar(function () { pintar(p); }, tt); })(i === n - 1 ? 100 : Math.round(acum), t);
        }
        temporizar(alTerminar, t + 700);
      }

      function pantallaFin() {
        var f = $("fin");
        $("fin-frase").textContent = FRASES[Math.floor(Math.random() * FRASES.length)];
        $("fin-rel").style.width = "0%";
        $("fin-txt").textContent = "0%";
        f.style.display = "flex";
        void f.offsetWidth;
        f.style.opacity = 1;
        cargaFalsa(function (p) {
          $("fin-rel").style.width = p + "%";
          $("fin-txt").textContent = p + "%";
        }, function () {
          if (nivelActual === 1) completarNivel1();   // desbloquea el nivel 2
          mostrarNiveles();
        });
      }

      function perder() {
        G.muerto = true;
        $("derrota").style.display = "flex";
      }

      function detenerJuego() {
        cancelAnimationFrame(raf);
        temporizadores.forEach(clearTimeout);
        temporizadores = [];
        G = null;
        K = {};
        var m = $("mundo"); if (m) m.innerHTML = "";
        $("derrota").style.display = "none";
        $("cartel").style.display = "none";
        var f = $("fin"); f.style.display = "none"; f.style.opacity = 0;
      }

      /* ===================== DIBUJO POR FOTOGRAMA ===================== */
      function dibujar() {
        var g = G, ancho = $("juego").clientWidth, i;
        var cam = Math.max(0, Math.min(g.L.LEN - ancho, g.x + g.w / 2 - ancho * 0.4));
        $("mundo").style.transform = "translate3d(" + (-cam) + "px,0,0)";

        var p = g.pjEl;
        colocar(p, g.x, g.y, g.w, g.h);
        var est = g.agach ? "agacha" : !g.suelo ? (g.vy > 0 ? "salta" : "cae") : (Math.abs(g.vx) > 0.2 ? "anda" : "");
        p.className = "pjg " + est + (g.dir < 0 ? " mira-izq" : "") + (g.poder > 0 ? " poder" : "") +
          (g.inv > 0 && Math.floor(g.inv / 5) % 2 ? " parpadeo" : "");
        p.style.setProperty("--d", g.dir);

        for (i = 0; i < g.L.enemigos.length; i++) {
          var e = g.L.enemigos[i];
          colocar(e.el, e.x, e.y, e.w, e.h);
          if (e.vivo && e.tipo === "koopa") e.el.style.transform = e.dir > 0 ? "none" : "scaleX(-1)";
        }
        for (i = 0; i < g.proy.length; i++) colocar(g.proy[i].el, g.proy[i].x, g.proy[i].y);

        // Barra de progreso (sube y baja según avanzas o retrocedes)
        var pct = Math.max(1, Math.min(100, Math.round(g.x / g.L.meta * 100)));
        $("progreso-relleno").style.width = pct + "%";
        $("progreso-txt").textContent = pct + "%";

        // HUD
        var clave = g.vidas + "|" + g.golpesSeta + "|" + monedasTotal + "|" + Math.ceil(Math.max(0, g.poder) / 60);
        if (clave !== g.hudKey) {
          g.hudKey = clave;
          var s = "", max = Math.max(4, g.vidas);
          for (i = 0; i < max; i++) s += i < g.vidas ? "❤️" : "🖤";
          if (g.golpesSeta) s += " 💢";
          $("hud-vida").textContent = s;
          $("hud-monedas").textContent = "🪙 " + monedasTotal;
          $("hud-poder").textContent = g.poder > 0 ? "⭐ Poder " + Math.ceil(g.poder / 60) + "s" : "";
        }
      }

      /* ===================== TECLADO ===================== */
      var TECLAS_JUEGO = ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
      document.addEventListener("keydown", function (e) {
        if (!G) return;
        K[e.code] = true;
        if (TECLAS_JUEGO.indexOf(e.code) > -1) e.preventDefault();
      });
      document.addEventListener("keyup", function (e) {
        if (!G) return;
        K[e.code] = false;
        if (TECLAS_JUEGO.indexOf(e.code) > -1) e.preventDefault();
      });
      window.addEventListener("blur", function () { K = {}; });
      window.addEventListener("resize", function () { if (G) { medir(); posEstaticos(); } });

      // Funciones que usa el resto de la página
      window.arrancarNivel = arrancarNivel;
      window.detenerJuego = detenerJuego;
      window.reintentarNivel = arrancarNivel;
    })();

    // Al cargar la página, comprobar el progreso guardado
    actualizarNiveles();
  </script>
</body>
</html>
