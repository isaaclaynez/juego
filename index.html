<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperSMR Bros</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: Verdana, sans-serif; }

    /* ===== ESCENARIO + CIELO (varios azules muy parecidos) ===== */
    .escena {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom,
        #2f86e8 0%, #3f95ee 18%, #55a6f2 35%,
        #6fb7f5 52%, #8cc7f8 68%, #a9d6fa 82%, #c4e4fb 100%);
    }

    /* Sol */
    .sol {
      position: absolute;
      top: 8vh;
      right: 10%;
      width: 110px;
      height: 110px;
      background: #ffe14d;
      border-radius: 50%;
      box-shadow: 0 0 40px 20px rgba(255, 225, 77, 0.6);
    }

    /* Nubes */
    .nube {
      position: absolute;
      left: 0;
      width: 160px;
      height: 50px;
      background: white;
      border-radius: 50px;
      will-change: transform;
    }
    .nube::before, .nube::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .nube::before { width: 70px; height: 70px; top: -30px; left: 20px; }
    .nube::after  { width: 90px; height: 90px; top: -45px; left: 70px; }

    /* Montañas y suelo (dibujos SVG) */
    .montanas {
      position: absolute;
      left: 0;
      bottom: 17vh;
      width: 100%;
      aspect-ratio: 16 / 5;
      max-height: 70vh;
      pointer-events: none;
    }
    .suelo {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 24vh;
      pointer-events: none;
    }
    .montanas svg, .suelo svg { width: 100%; height: 100%; display: block; }

    /* ===== PANTALLAS ===== */
    .pantalla { position: absolute; inset: 0; }

    #inicio h1 {
      text-align: center;
      margin-top: 12vh;
      font-family: Impact, Arial Black, sans-serif;
      font-size: clamp(40px, 9vw, 110px);
      color: #ffd23f;
      letter-spacing: 4px;
      text-shadow: 4px 4px 0 #d62828, 8px 8px 0 #7a1010;
    }

    #boton-empezar {
      position: absolute;
      bottom: 6vh;
      left: 50%;
      transform: translateX(-50%);
      background: #d62828;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 20px 40px;
      border: 5px solid #ffd23f;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7a1010;
    }
    #boton-empezar:hover {
      background: #ef3b3b;
      transform: translateX(-50%) translateY(-3px);
    }

    /* ===== PANTALLA DE NIVELES ===== */
    #niveles { display: none; }

    #niveles h2 {
      text-align: center;
      margin-top: 8vh;
      font-family: Impact, Arial Black, sans-serif;
      font-size: clamp(30px, 5vw, 60px);
      color: #ffd23f;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0 #d62828, 6px 6px 0 #7a1010;
    }

    .tarjetas {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
      margin-top: 6vh;
    }

    .nivel {
      position: relative;
      width: 260px;
      background: #1e1e2f;
      border: 5px solid #ffd23f;
      border-radius: 10px;
      box-shadow: 0 6px 0 #7a1010;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .nivel:hover { transform: translateY(-5px); }
    .nivel .portada { display: block; width: 100%; height: 160px; }
    .nivel .etiqueta {
      padding: 10px;
      text-align: center;
      color: white;
      font-family: Impact, Arial Black, sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
    }

    /* Candado que bloquea el nivel */
    .bloqueo {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 30, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: not-allowed;
    }
    .bloqueo svg { width: 80px; height: 80px; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6)); }
    .nivel.desbloqueado .bloqueo { display: none; }
    .nivel.bloqueado:hover { transform: none; }

    /* Aviso rojo */
    #aviso {
      position: absolute;
      top: 5vh;
      left: 50%;
      transform: translateX(-50%);
      background: #c1121f;
      color: white;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      padding: 16px 28px;
      border: 4px solid #ffd6d6;
      border-radius: 8px;
      box-shadow: 0 6px 0 #6b0a12;
      max-width: 90%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 10;
    }
    #aviso.visible { opacity: 1; }

    /* ===== PANTALLA DE JUEGO ===== */
    #juego { display: none; }

    #boton-volver {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #d62828;
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 20px;
      border: 3px solid #ffd23f;
      border-radius: 8px;
      cursor: pointer;
    }
    #boton-volver:hover { background: #ef3b3b; }

    /* ===== PANEL "COMENZAR NIVEL" ===== */
    #comenzar {
      display: none;
      z-index: 20;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
    }
    .panel-comenzar {
      background: #1e1e2f;
      border: 5px solid #ffd23f;
      border-radius: 12px;
      box-shadow: 0 8px 0 #7a1010;
      padding: 30px 50px;
      text-align: center;
    }
    .panel-comenzar h3 {
      font-family: Impact, Arial Black, sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      color: #ffd23f;
      margin-bottom: 25px;
    }
    .btn-grande {
      display: block;
      width: 100%;
      background: #d62828;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 16px 30px;
      border: 4px solid #ffd23f;
      border-radius: 8px;
      box-shadow: 0 5px 0 #7a1010;
      cursor: pointer;
    }
    .btn-grande:hover { background: #ef3b3b; }
    .btn-chico {
      margin-top: 18px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 15px;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ===== PANTALLA NEGRA: ELEGIR PERSONAJE + CARGA ===== */
    #negro {
      display: none;
      z-index: 30;
      background: #000;
      opacity: 0;
      transition: opacity 0.8s;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6vh 0;
    }
    #aviso-pj {
      background: #1e1e2f;
      color: #ffd23f;
      font-family: Impact, Arial Black, sans-serif;
      font-size: clamp(24px, 4vw, 44px);
      letter-spacing: 3px;
      padding: 14px 40px;
      border: 4px solid #ffd23f;
      border-radius: 8px;
    }
    .personajes { display: flex; gap: 50px; justify-content: center; flex-wrap: wrap; }
    .pj {
      width: 220px;
      background: #1e1e2f;
      border: 5px solid #ffd23f;
      border-radius: 12px;
      padding: 14px 10px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.4s, border-color 0.2s;
    }
    .pj:hover { transform: translateY(-6px); }
    .pj svg { display: block; width: 100%; height: min(38vh, 300px); }
    .pj .izq { display: none; }
    .pj:hover .der { display: none; }
    .pj:hover .izq { display: block; }
    .pj .nombre {
      margin-top: 8px;
      color: white;
      font-family: Impact, Arial Black, sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
    }
    .personajes.ya-elegido { pointer-events: none; }
    .personajes.ya-elegido .pj { opacity: 0.25; transform: none; }
    .personajes.ya-elegido .pj.elegido { opacity: 1; border-color: #5bea5b; }

    #carga {
      width: min(600px, 80%);
      text-align: center;
      color: white;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.4s;
      min-height: 60px;
    }
    #carga.visible { opacity: 1; }
    #carga-barra {
      height: 26px;
      background: #222;
      border: 3px solid #ffd23f;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    #carga-relleno {
      width: 0%;
      height: 100%;
      background: linear-gradient(to bottom, #8cf064, #2f8f1f);
      transition: width 0.4s ease-out;
    }
  </style>
</head>
<body>

  <div class="escena">
    <div class="sol"></div>
    <div id="nubes"></div>

    <!-- MONTAÑAS (se dibujan con el script de abajo) -->
    <div class="montanas">
      <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="gBruma" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cfe8fb" stop-opacity="0"/>
            <stop offset="1" stop-color="#cfe8fb" stop-opacity="0.65"/>
          </linearGradient>
          <linearGradient id="gRoca" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="480">
            <stop offset="0" stop-color="#7b8798"/>
            <stop offset="0.6" stop-color="#8593a6"/>
            <stop offset="1" stop-color="#a3b3c8"/>
          </linearGradient>
          <g id="mont-defs"></g>
        </defs>

        <g id="mont-lejanas"></g>
        <g id="mont-principales"></g>

        <!-- Colinas verdes al pie -->
        <path fill="#5c9a50" d="M0,500 L0,462 Q150,425 320,462 T640,455 T960,466 T1280,452 T1600,460 L1600,500Z"/>
        <path fill="#4a8a3f" d="M0,500 L0,482 Q200,455 420,484 T860,478 T1300,486 T1600,476 L1600,500Z"/>
        <rect x="0" y="330" width="1600" height="170" fill="url(#gBruma)"/>
      </svg>
    </div>

    <!-- SUELO -->
    <div class="suelo">
      <svg viewBox="0 0 1600 220" preserveAspectRatio="xMidYMin slice">
        <defs>
          <linearGradient id="gTierra" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a5a34"/>
            <stop offset="1" stop-color="#4a2c17"/>
          </linearGradient>
          <linearGradient id="gHierba" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7be04f"/>
            <stop offset="1" stop-color="#37901f"/>
          </linearGradient>
        </defs>
        <rect x="0" y="40" width="1600" height="180" fill="url(#gTierra)"/>
        <g id="detalles-suelo"></g>
      </svg>
    </div>

    <!-- PANTALLA 1: INICIO -->
    <div id="inicio" class="pantalla">
      <h1>SuperSMR Bros</h1>
      <button id="boton-empezar" onclick="mostrarNiveles()">Clica aquí para comenzar</button>
    </div>

    <!-- PANTALLA 2: SELECCIÓN DE NIVELES -->
    <div id="niveles" class="pantalla">
      <h2>Selecciona nivel</h2>

      <div class="tarjetas">

        <!-- NIVEL 1 (siempre disponible) -->
        <div class="nivel desbloqueado" id="nivel1" onclick="entrarNivel(1)">
          <svg class="portada" viewBox="0 0 260 160" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="p1Cielo" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2f86e8"/>
                <stop offset="0.6" stop-color="#7cc0f7"/>
                <stop offset="1" stop-color="#c4e4fb"/>
              </linearGradient>
            </defs>
            <rect width="260" height="160" fill="url(#p1Cielo)"/>
            <circle cx="220" cy="28" r="16" fill="#ffe14d"/>
            <g fill="#fff">
              <ellipse cx="60" cy="30" rx="26" ry="8"/><circle cx="52" cy="25" r="9"/><circle cx="68" cy="22" r="11"/>
              <ellipse cx="160" cy="48" rx="18" ry="6" opacity="0.9"/><circle cx="156" cy="44" r="7" opacity="0.9"/>
            </g>
            <polygon fill="#a3b8d2" points="0,125 40,80 75,105 120,70 170,110 210,85 260,115 260,160 0,160"/>
            <polygon fill="#8593a6" points="10,130 70,55 115,130"/>
            <polygon fill="#566177" points="70,55 115,130 88,130 80,95"/>
            <polygon fill="#f4f8fd" points="70,55 58,76 66,72 72,79 79,72 84,78"/>
            <polygon fill="#8593a6" points="95,130 160,25 225,130"/>
            <polygon fill="#566177" points="160,25 225,130 185,130 168,80 172,55"/>
            <polygon fill="#f4f8fd" points="160,25 143,58 152,52 160,62 169,52 178,58 174,50"/>
            <path fill="#5c9a50" d="M0,160 L0,132 Q70,118 140,132 T260,128 L260,160Z"/>
            <rect y="140" width="260" height="20" fill="#4cc233"/>
            <rect y="152" width="260" height="8" fill="#8a5a34"/>
          </svg>
          <div class="etiqueta">Nivel 1</div>
        </div>

        <!-- NIVEL 2 (bloqueado hasta completar el 1) -->
        <div class="nivel bloqueado" id="nivel2" onclick="entrarNivel(2)">
          <svg class="portada" viewBox="0 0 260 160" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="p2Cielo" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3a2a6b"/>
                <stop offset="0.6" stop-color="#c0527a"/>
                <stop offset="1" stop-color="#ffb26b"/>
              </linearGradient>
            </defs>
            <rect width="260" height="160" fill="url(#p2Cielo)"/>
            <circle cx="60" cy="95" r="18" fill="#ffd27a"/>
            <polygon fill="#4a3a6a" points="0,120 50,75 100,110 150,60 210,105 260,85 260,160 0,160"/>
            <polygon fill="#2c2147" points="0,145 60,100 120,140 190,95 260,135 260,160 0,160"/>
          </svg>
          <div class="etiqueta">Nivel 2</div>

          <!-- Candado -->
          <div class="bloqueo">
            <svg viewBox="0 0 64 64">
              <path d="M18 28 V20 a14 14 0 0 1 28 0 V28" fill="none" stroke="#c9ccd3" stroke-width="7" stroke-linecap="round"/>
              <rect x="10" y="28" width="44" height="30" rx="6" fill="#ffd23f" stroke="#a07c10" stroke-width="3"/>
              <circle cx="32" cy="41" r="5" fill="#5a4308"/>
              <rect x="30" y="43" width="4" height="9" rx="2" fill="#5a4308"/>
            </svg>
          </div>
        </div>

      </div>
    </div>

    <!-- PANEL: COMENZAR NIVEL -->
    <div id="comenzar" class="pantalla">
      <div class="panel-comenzar">
        <h3 id="titulo-nivel">Nivel 1</h3>
        <button class="btn-grande" onclick="comenzarNivel()">Comenzar nivel</button>
        <button class="btn-chico" onclick="mostrarNiveles()">Volver</button>
      </div>
    </div>

    <!-- PANTALLA NEGRA: ELEGIR PERSONAJE Y CARGA -->
    <div id="negro" class="pantalla">
      <div id="aviso-pj">Elige tu personaje</div>

      <div class="personajes" id="personajes">
        <div class="pj" id="pj-zipi" onclick="elegirPersonaje('zipi')">
          <div id="dib-zipi"></div>
          <div class="nombre">Zipi</div>
        </div>
        <div class="pj" id="pj-zape" onclick="elegirPersonaje('zape')">
          <div id="dib-zape"></div>
          <div class="nombre">Zape</div>
        </div>
      </div>

      <div id="carga">
        <div id="carga-barra"><div id="carga-relleno"></div></div>
        <span id="carga-texto">0%</span>
      </div>
    </div>

    <!-- PANTALLA 3: JUEGO (vacía, sin configurar) -->
    <div id="juego" class="pantalla">
      <button id="boton-volver" onclick="volverANiveles()">← Niveles</button>
    </div>

    <!-- Aviso rojo -->
    <div id="aviso">Para acceder a este nivel debes completar el anterior</div>
  </div>

  <script>
    /* ===== PROGRESO CIFRADO ===== */
    var CLAVE = "SMR-superbros-2026-x9K";   // cambia este texto por el tuyo
    var nivelActual = 0;

    // Huella digital del texto: si alguien modifica el progreso a mano, no coincide
    function firma(texto) {
      var h = 2166136261;
      for (var i = 0; i < texto.length; i++) {
        h ^= texto.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0).toString(16);
    }

    // Guarda "nivel 1 completado" cifrado y firmado
    function guardarProgreso() {
      try {
        var datos = "nivel1=completado";
        localStorage.setItem("smr_p", btoa(datos + "|" + firma(datos + CLAVE)));
      } catch (e) {}
    }

    // Lee el progreso y comprueba que la firma sea válida
    function nivel1Completado() {
      try {
        var t = atob(localStorage.getItem("smr_p") || "");
        var partes = t.split("|");
        return partes[0] === "nivel1=completado" && partes[1] === firma(partes[0] + CLAVE);
      } catch (e) {
        return false;
      }
    }

    // Pone o quita el candado del nivel 2 según el progreso
    function actualizarNiveles() {
      var n2 = document.getElementById("nivel2");
      if (nivel1Completado()) {
        n2.classList.add("desbloqueado");
        n2.classList.remove("bloqueado");
      } else {
        n2.classList.add("bloqueado");
        n2.classList.remove("desbloqueado");
      }
    }

    // Esto se llamará desde el juego cuando se termine el nivel 1
    function completarNivel1() {
      guardarProgreso();
      actualizarNiveles();
    }

    // Para volver a bloquear el nivel 2 (útil para hacer pruebas)
    function reiniciarProgreso() {
      try { localStorage.removeItem("smr_p"); } catch (e) {}
      actualizarNiveles();
    }

    /* ===== NAVEGACIÓN ENTRE PANTALLAS ===== */
    function mostrarNiveles() {
      document.getElementById("inicio").style.display = "none";
      document.getElementById("juego").style.display = "none";
      document.getElementById("comenzar").style.display = "none";
      var negro = document.getElementById("negro");
      negro.style.display = "none";
      negro.style.opacity = 0;
      document.getElementById("niveles").style.display = "block";
      actualizarNiveles();
    }

    function volverANiveles() {
      mostrarNiveles();
    }

    // Al pulsar un nivel: aparece el recuadro "Comenzar nivel"
    function entrarNivel(n) {
      if (n === 2 && !nivel1Completado()) {
        mostrarAviso();
        return;
      }
      nivelActual = n;
      document.getElementById("titulo-nivel").textContent = "Nivel " + n;
      document.getElementById("comenzar").style.display = "flex";
    }

    // Al pulsar "Comenzar nivel": la pantalla se pone en negro
    function comenzarNivel() {
      var negro = document.getElementById("negro");
      reiniciarSeleccion();
      document.getElementById("comenzar").style.display = "none";
      negro.style.display = "flex";
      void negro.offsetWidth;          // fuerza el efecto de fundido
      negro.style.opacity = 1;
    }

    function reiniciarSeleccion() {
      document.getElementById("personajes").classList.remove("ya-elegido");
      document.getElementById("pj-zipi").classList.remove("elegido");
      document.getElementById("pj-zape").classList.remove("elegido");
      document.getElementById("carga").classList.remove("visible");
      document.getElementById("carga-relleno").style.width = "0%";
      document.getElementById("carga-texto").textContent = "0%";
    }

    var personajeElegido = null;

    function elegirPersonaje(nombre) {
      personajeElegido = nombre;
      document.getElementById("personajes").classList.add("ya-elegido");
      document.getElementById("pj-" + nombre).classList.add("elegido");
      document.getElementById("carga").classList.add("visible");
      cargar();
    }

    // Barra de carga: unos 5 segundos, avanzando a saltos irregulares
    function cargar() {
      var n = 10, i, s = 0, s2 = 0, acum = 0, t = 0;
      var saltos = [], pausas = [], pct = [];
      for (i = 0; i < n; i++) { saltos.push(0.4 + Math.random()); s += saltos[i]; }
      for (i = 0; i < n; i++) { pausas.push(0.4 + Math.random()); s2 += pausas[i]; }
      for (i = 0; i < n; i++) { acum += saltos[i] / s * 100; pct.push(Math.round(acum)); }
      pct[n - 1] = 100;

      pct.forEach(function (p, i) {
        t += pausas[i] / s2 * 5000;
        setTimeout(function () {
          document.getElementById("carga-relleno").style.width = p + "%";
          document.getElementById("carga-texto").textContent = p + "%";
        }, t);
      });
      setTimeout(iniciarJuego, t + 700);
    }

    // Termina la carga: se quita el negro y se muestra la pantalla de juego (vacía por ahora)
    function iniciarJuego() {
      var negro = document.getElementById("negro");
      document.getElementById("niveles").style.display = "none";
      document.getElementById("juego").style.display = "block";
      negro.style.opacity = 0;
      setTimeout(function () { negro.style.display = "none"; }, 800);
    }

    /* ===== AVISO ROJO (desaparece a los 3 segundos) ===== */
    var temporizadorAviso = null;
    function mostrarAviso() {
      var aviso = document.getElementById("aviso");
      aviso.classList.add("visible");
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(function () {
        aviso.classList.remove("visible");
      }, 3000);
    }

    // Generador de números "aleatorios" repetibles: misma semilla = mismos resultados siempre
    function semilla(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    /* ===== NUBES: patrón de 5 minutos que se repite ===== */
    (function () {
      var CICLO = 300;            // segundos
      var r = semilla(2024);
      var contenedor = document.getElementById("nubes");
      var nubes = [];

      for (var i = 0; i < 18; i++) {
        var el = document.createElement("div");
        el.className = "nube";
        el.style.top = (3 + r() * 30) + "vh";
        el.style.opacity = (0.8 + r() * 0.15).toFixed(2);
        contenedor.appendChild(el);
        nubes.push({
          el: el,
          inicio: r() * CICLO,
          duracion: 50 + r() * 60,
          escala: 0.6 + r() * 0.7
        });
      }

      function mover() {
        var t = performance.now() / 1000;
        var ancho = window.innerWidth;
        for (var i = 0; i < nubes.length; i++) {
          var n = nubes[i];
          var fase = (((t - n.inicio) % CICLO) + CICLO) % CICLO / n.duracion;
          if (fase <= 1) {
            var px = -300 + fase * (ancho + 600);
            n.el.style.display = "block";
            n.el.style.transform = "translate3d(" + px.toFixed(1) + "px,0,0) scale(" + n.escala.toFixed(2) + ")";
          } else {
            n.el.style.display = "none";
          }
        }
        requestAnimationFrame(mover);
      }
      mover();
    })();

    /* ===== MONTAÑAS: relieve generado con código ===== */
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var r = semilla(31);   // cambia este número para obtener otras montañas
      var defs = document.getElementById("mont-defs");
      var lejos = document.getElementById("mont-lejanas");
      var cerca = document.getElementById("mont-principales");

      function crear(padre, tipo, atrib) {
        var e = document.createElementNS(NS, tipo);
        for (var k in atrib) e.setAttribute(k, atrib[k]);
        padre.appendChild(e);
        return e;
      }
      function p(x, y) { return x.toFixed(1) + "," + y.toFixed(1); }

      function ruido() {
        var v = [], i;
        for (i = 0; i < 256; i++) v.push(r());
        return function (x) {
          var i = Math.floor(x), f = x - i;
          f = f * f * (3 - 2 * f);
          return v[i & 255] * (1 - f) + v[(i + 1) & 255] * f;
        };
      }

      function cordillera(color, base, amp, esc) {
        var n1 = ruido(), n2 = ruido(), n3 = ruido();
        var pts = "0,500", x;
        for (x = 0; x <= 1600; x += 8) {
          var c1 = 1 - Math.abs(2 * n1(x / esc) - 1);
          var y = base - amp * c1 - amp * 0.3 * n2(x / (esc / 3)) - amp * 0.08 * n3(x / (esc / 9));
          pts += " " + p(x, y);
        }
        pts += " 1600,500";
        crear(lejos, "polygon", { points: pts, fill: color });
      }
      cordillera("#bccfe4", 305, 120, 170);
      cordillera("#a3b8d2", 335, 105, 120);

      function montana(id, px, py, Wl, Wr, base) {
        var H = base - py;
        var nA = ruido(), nB = ruido(), nC = ruido(), nS = ruido(), nT = ruido();
        var i, n, t;

        function altura(x) {
          var d = x < px ? (px - x) / Wl : (x - px) / Wr;
          if (d >= 1) return 0;
          var h = H * Math.pow(1 - d, 1.3);
          var k = Math.min(1, d * 4) * Math.min(1, (1 - d) * 3);
          h += k * H * ((nA(x / 70) - 0.5) * 0.16 + (nB(x / 22) - 0.5) * 0.07 + (nC(x / 7) - 0.5) * 0.025);
          return Math.max(0, h);
        }

        var xs = [];
        n = Math.ceil(Wl / 6);
        for (i = 0; i < n; i++) xs.push(px - Wl + i * Wl / n);
        n = Math.ceil(Wr / 6);
        for (i = 0; i <= n; i++) xs.push(px + i * Wr / n);

        var borde = [];
        for (i = 0; i < xs.length; i++) borde.push(p(xs[i], base - altura(xs[i])));
        var sil = p(px - Wl, 500) + " " + borde.join(" ") + " " + p(px + Wr, 500);

        var cp = crear(defs, "clipPath", { id: "cpm" + id });
        crear(cp, "polygon", { points: sil });

        crear(cerca, "polygon", { points: sil, fill: "url(#gRoca)" });
        var g = crear(cerca, "g", { "clip-path": "url(#cpm" + id + ")" });

        var cresta = [], rx = px + 0.1 * Wr;
        for (i = 0; i <= 24; i++) {
          t = i / 24;
          var cx = px + (rx - px) * t + (nA(t * 7 + 40) - 0.5) * 0.36 * Wl * Math.min(1, t * 4);
          cresta.push([cx, py + (base + 30 - py) * t]);
        }
        var crestaTxt = cresta.map(function (q) { return p(q[0], q[1]); }).join(" ");

        var nieve = "M" + p(px - Wl, py - 40);
        for (i = 0; i < xs.length; i++) {
          var sy = py + H * 0.2 + (nS(xs[i] / 40) - 0.5) * H * 0.13 + (nT(xs[i] / 11) - 0.5) * H * 0.05;
          nieve += " L" + p(xs[i], sy);
        }
        nieve += " L" + p(px + Wr, py - 40) + " Z";
        crear(g, "path", { d: nieve, fill: "#f4f8fd" });

        for (i = 0; i < 80; i++) {
          var fx = px - Wl * 0.9 + r() * (Wl * 0.9 + Wr * 0.9);
          var fy = py + r() * (base - py);
          var s = 14 + r() * 46;
          var tri = p(fx, fy) + " " +
                    p(fx + s * (0.3 + r() * 0.6), fy + s * (0.3 + r() * 0.6)) + " " +
                    p(fx - s * (0.2 + r() * 0.6), fy + s * (0.6 + r() * 0.9));
          crear(g, "polygon", {
            points: tri,
            fill: r() > 0.5 ? "#ffffff" : "#1b2638",
            "fill-opacity": (0.03 + r() * 0.07).toFixed(3)
          });
        }

        crear(g, "polygon", {
          points: crestaTxt + " " + p(px + Wr + 60, base + 30) + " " + p(px + Wr + 60, py - 40) + " " + p(px, py - 40),
          fill: "rgba(255,240,205,0.13)"
        });

        crear(g, "polygon", {
          points: p(px, py - 40) + " " + crestaTxt + " " + p(px - Wl - 60, base + 30) + " " + p(px - Wl - 60, py - 40),
          fill: "rgba(28,42,82,0.38)"
        });

        for (i = 0; i < 9; i++) {
          var gx = px + (r() - 0.5) * Math.min(Wl, Wr) * 1.0;
          var gy = py + H * (0.1 + r() * 0.25);
          var izq = [], der = [];
          for (t = 0; t <= 1.0001; t += 1 / 14) {
            var bx = gx + (gx - px) * 0.45 * t + (nA(i * 13 + t * 6) - 0.5) * 40;
            var by = gy + (base + 20 - gy) * t;
            var w = 1 + 8 * t;
            izq.push(p(bx - w, by));
            der.push(p(bx + w, by));
          }
          crear(g, "polygon", {
            points: izq.concat(der.reverse()).join(" "),
            fill: "rgba(20,30,50," + (0.14 + r() * 0.12).toFixed(2) + ")"
          });
        }

        crear(g, "polyline", { points: crestaTxt, fill: "none", stroke: "rgba(255,255,255,0.28)", "stroke-width": 2 });
      }

      montana(0, 800, 40, 440, 460, 472);
      montana(1, 300, 135, 330, 340, 472);
      montana(2, 1330, 150, 330, 300, 472);
    })();

    /* ===== SUELO: césped, tierra y piedras ===== */
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var g = document.getElementById("detalles-suelo");
      var r = semilla(7);
      var x, i;

      function el(tipo, atributos) {
        var e = document.createElementNS(NS, tipo);
        for (var k in atributos) e.setAttribute(k, atributos[k]);
        g.appendChild(e);
        return e;
      }
      function borde(x) { return 26 + 4 * Math.sin(x / 90) + 3 * Math.sin(x / 37 + 1); }

      for (i = 0; i < 3; i++) {
        var d = "";
        for (x = 0; x <= 1600; x += 40) {
          d += (x ? "L" : "M") + x + "," + (95 + i * 48 + 8 * Math.sin(x / 130 + i)).toFixed(1) + " ";
        }
        el("path", { d: d, fill: "none", stroke: "rgba(0,0,0,0.14)", "stroke-width": 10 });
      }

      var colores = ["#9b8b7a", "#6e5f50", "#b3a595", "#5a4a3b"];
      for (i = 0; i < 80; i++) {
        var rx = 3 + r() * 7;
        el("ellipse", {
          cx: (r() * 1600).toFixed(1), cy: (75 + r() * 140).toFixed(1),
          rx: rx.toFixed(1), ry: (rx * 0.7).toFixed(1),
          fill: colores[Math.floor(r() * colores.length)]
        });
      }

      for (i = 0; i < 16; i++) {
        var cx = r() * 1600, cy = 90 + r() * 115, s = 12 + r() * 16, pts = "";
        for (var a = 0; a < 7; a++) {
          var ang = a / 7 * Math.PI * 2, rad = s * (0.7 + r() * 0.4);
          pts += (cx + Math.cos(ang) * rad * 1.3).toFixed(1) + "," + (cy + Math.sin(ang) * rad * 0.8).toFixed(1) + " ";
        }
        el("polygon", { points: pts, fill: "#8d9199", stroke: "#4d4f55", "stroke-width": 2 });
        el("ellipse", { cx: (cx - s * 0.3).toFixed(1), cy: (cy - s * 0.3).toFixed(1), rx: (s * 0.4).toFixed(1), ry: (s * 0.2).toFixed(1), fill: "rgba(255,255,255,0.25)" });
      }

      var arriba = "", abajo = [];
      for (x = 0; x <= 1600; x += 10) arriba += (x ? "L" : "M") + x + "," + borde(x).toFixed(1) + " ";
      for (x = 1600; x >= 0; x -= 10) abajo.push("L" + x + "," + (borde(x) + 30 + ((x / 10) % 2 ? 9 : 0) + r() * 6).toFixed(1));
      el("path", { d: arriba + abajo.join(" ") + "Z", fill: "url(#gHierba)" });

      var linea = "";
      for (x = 0; x <= 1600; x += 10) linea += x + "," + borde(x).toFixed(1) + " ";
      el("polyline", { points: linea, fill: "none", stroke: "#a5f27a", "stroke-width": 3 });

      for (x = 0; x < 1600; x += 7) {
        var y = borde(x);
        el("polygon", {
          points: x + "," + (y + 3) + " " + (x + 2.5) + "," + (y - 6 - r() * 7).toFixed(1) + " " + (x + 5) + "," + (y + 3),
          fill: r() > 0.5 ? "#4cc233" : "#6fe04a"
        });
      }

      for (i = 0; i < 14; i++) {
        var fx = r() * 1600;
        el("circle", { cx: fx.toFixed(1), cy: (borde(fx) + 12).toFixed(1), r: 2.6, fill: r() > 0.5 ? "#ffffff" : "#ffe14d" });
      }
    })();

    /* ===== PERSONAJES: Zipi y Zape (cada uno mirando a la derecha y a la izquierda) ===== */
    var ZIPI = `
      <g transform="translate(0,60)">
        <ellipse cx="100" cy="250" rx="55" ry="8" fill="rgba(0,0,0,.35)"/>
        <rect x="74" y="212" width="24" height="30" rx="8" fill="#1d4ed8"/>
        <rect x="104" y="212" width="24" height="30" rx="8" fill="#1d4ed8"/>
        <ellipse cx="96" cy="243" rx="22" ry="10" fill="#5a3418"/>
        <ellipse cx="128" cy="243" rx="22" ry="10" fill="#5a3418"/>
        <ellipse cx="100" cy="160" rx="54" ry="58" fill="#d62828"/>
        <path d="M56 172 Q100 152 144 172 Q150 218 100 226 Q50 218 56 172Z" fill="#2563eb"/>
        <rect x="110" y="120" width="12" height="44" rx="5" fill="#2563eb"/>
        <circle cx="116" cy="170" r="4" fill="#ffd23f"/>
        <ellipse cx="104" cy="158" rx="13" ry="30" transform="rotate(-15 104 158)" fill="#b81f1f"/>

        <path d="M60 72 Q60 26 100 24 Q142 26 142 72Z" fill="#d62828"/>
        <rect x="58" y="68" width="96" height="10" rx="5" fill="#a01818"/>
        <circle cx="96" cy="50" r="14" fill="#fff"/>
      </g>`;

    var ZAPE = `
      <ellipse cx="100" cy="312" rx="45" ry="7" fill="rgba(0,0,0,.35)"/>
      <rect x="80" y="185" width="18" height="108" rx="7" fill="#2563eb"/>
      <rect x="102" y="185" width="18" height="108" rx="7" fill="#1e4fc4"/>
      <ellipse cx="92" cy="299" rx="20" ry="9" fill="#f1f1f1" stroke="#555" stroke-width="2"/>
      <ellipse cx="118" cy="299" rx="20" ry="9" fill="#f1f1f1" stroke="#555" stroke-width="2"/>
      <rect x="74" y="90" width="52" height="102" rx="20" fill="#22a84a"/>
      <rect x="74" y="178" width="52" height="9" fill="#0f3d8a"/>
      <rect x="92" y="76" width="16" height="18" fill="#e8a878"/>
      <rect x="96" y="100" width="15" height="82" rx="7" fill="#1b8a3b"/>
      <circle cx="103" cy="186" r="8" fill="#f4b98a"/>
      <circle cx="73" cy="54" r="6" fill="#e8a878"/>
      <circle cx="100" cy="50" r="30" fill="#f4b98a"/>
      <circle cx="128" cy="54" r="6" fill="#eaa070"/>
      <ellipse cx="113" cy="46" rx="5" ry="6" fill="#fff"/>
      <circle cx="115" cy="47" r="3" fill="#222"/>
      <path d="M110 68 Q120 73 128 66" stroke="#7a3b1e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M69 42 Q70 8 100 8 Q130 10 131 42Z" fill="#1d4ed8"/>
      <path d="M118 38 L160 42 Q164 50 154 50 L118 46Z" fill="#153a9a"/>`;

    // dir = 1 mira a la derecha, dir = -1 mira a la izquierda (las letras no se ven al revés)
    function dibujarPJ(nombre, dir) {
      var giro = (dir === 1) ? "" : ' transform="translate(200,0) scale(-1,1)"';
      var X = function (v) { return dir === 1 ? v : 200 - v; };
      var cuerpo, letra;
      if (nombre === "zipi") {
        cuerpo = ZIPI;
        letra = '<text x="' + X(96) + '" y="117" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="22" fill="#d62828">Z</text>';
      } else {
        cuerpo = ZAPE;
        letra = '<text x="' + X(100) + '" y="32" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="17" fill="#fff">ZA</text>';
      }
      return '<svg viewBox="0 0 200 320"><g' + giro + '>' + cuerpo + '</g>' + letra + '</svg>';
    }

    // En el recuadro se ve mirando a la derecha; al pasar el ratón por encima, mira a la izquierda
    ["zipi", "zape"].forEach(function (nombre) {
      document.getElementById("dib-" + nombre).innerHTML =
        '<div class="der">' + dibujarPJ(nombre, 1) + '</div>' +
        '<div class="izq">' + dibujarPJ(nombre, -1) + '</div>';
    });

    // Al cargar la página, comprobar el progreso guardado
    actualizarNiveles();
  </script>
